name: factify
description: "Aplikasi Literasi Digital Factify"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.1.1
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  video_player: ^2.10.1
  share_plus: ^7.2.1 
  timeago: ^3.6.0  
  http: ^1.2.2
  flutter_dotenv: ^5.1.0
  flutter_markdown: ^0.7.7+1

  url_launcher: any
  youtube_player_iframe: ^5.2.2
  fl_chart: 0.68.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env                                    
    - assets/images/
    - assets/images/data-privacy.png
    - assets/images/digital_ethics.png
    - assets/images/fake_news.jpg
    - assets/images/CHATBOT.webp             
    - assets/videos/